[package]
name = "jichi-desktop"
version = "0.1.0"
license = "Apache-2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jichi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
ureq = "2"
calamine = "0.36.1"
pdf-extract = "0.12.1"
zip = "8.6.0"
quick-xml = "0.42.0"
docx-rs = "0.4.22"
rust_xlsxwriter = "0.99.1"
ttf-parser = "0.25.1"
subsetter = "0.2.6"
flate2 = "1.1.10"
portable-pty = "0.9"
base64 = "0.23.1"
tauri-plugin-notification = "2.4.0"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "macros", "time"] }





# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
